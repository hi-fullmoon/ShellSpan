[package]
name = "shellspan-account-sandbox-prototype"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.11.0"
trash = "=5.2.9"
uuid = { version = "=1.26.1", features = ["v4", "serde"] }
windows-sys = { version = "0.61", features = [
  "Win32_Globalization", "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization",
  "Win32_NetworkManagement_NetManagement", "Win32_NetworkManagement_WindowsFilteringPlatform",
  "Win32_NetworkManagement_Dns", "Win32_NetworkManagement_IpHelper",
  "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_Rpc", "Win32_System_JobObjects",
  "Win32_System_StationsAndDesktops", "Win32_Graphics_Gdi", "Win32_System_SystemInformation", "Win32_UI_WindowsAndMessaging",
  "Win32_System_SystemServices",
  "Win32_System_Services",
  "Win32_System_RemoteDesktop", "Win32_System_IO",
  "Win32_System_Ioctl",
  "Win32_System_LibraryLoader",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Diagnostics_Etw", "Win32_System_Time",
  "Win32_Security_Isolation",
  "Win32_Security_Credentials",
  "Win32_Security_Authentication_Identity",
  "Win32_Networking_WinSock", "Win32_System_Registry",
  "Win32_UI_Shell", "Win32_System_Com",
  "Wdk_Foundation", "Wdk_Storage_FileSystem", "Wdk_System_Memory",
] }

[workspace]

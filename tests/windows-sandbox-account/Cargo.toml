[package]
name = "shellspan-account-sandbox-prototype"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "=1.26.1", features = ["v4"] }
windows-sys = { version = "0.61", features = [
  "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization",
  "Win32_NetworkManagement_NetManagement", "Win32_NetworkManagement_WindowsFilteringPlatform",
  "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_Rpc",
] }

[workspace]

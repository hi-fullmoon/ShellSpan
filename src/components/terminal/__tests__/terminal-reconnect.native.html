<html lang="zh-CN">
  <head><meta charset="UTF-8"><title>Terminal reconnect regression</title></head>
  <body><div id="root" style="width:100vw;height:100vh"></div><script type="module">
  try { await import('./terminal-reconnect.native.tsx'); }

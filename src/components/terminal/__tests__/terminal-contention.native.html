<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><title>Terminal Agent contention</title></head>
<body><div id="root" style="width:100vw;height:100dvh;overflow:hidden"></div>
<script type="module">
try { await import('./terminal-contention.native.tsx'); }
catch (error) {
  await fetch(`/__agent-stream-result/${new URL(location.href).searchParams.get('token')}`, {
    method: 'POST', body: JSON.stringify({ ok: false, error: String(error?.stack ?? error) }),
  });
}
</script></body></html>

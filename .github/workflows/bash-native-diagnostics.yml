name: Bash Native Diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bash:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Inspect native PTY session APIs
        run: python3 scripts/diagnose-macos-pty.py > /tmp/shellspan-pty-apis.json
      - name: Save native API diagnostics
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: native-pty-apis
          path: /tmp/shellspan-pty-apis.json
          retention-days: 1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.95.0
      - uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
      - run: pnpm build
      - name: Run native Bash stress checks
        env:
          SHELLSPAN_BASH_FAILURE_DIAGNOSTICS: '1'
        run: |
          /bin/bash --version
          uname -a
          node scripts/verify-bash-native.mjs

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Unpublished release tag to build (for example v2.1.0 or v2.1.0-rc.1)
        required: true
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate Release
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      notes: ${{ steps.meta.outputs.notes }}
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release and reviewed notes
        id: meta
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release-preflight.mjs

  quality:
    name: Release Quality Gate
    needs: preflight
    uses: ./.github/workflows/quality-gate.yml
    with:
      ref: ${{ needs.preflight.outputs.sha }}

  build-frontend:
    name: Test and Build Frontend
    runs-on: ubuntu-24.04
    needs: preflight
    steps:
      - name: Checkout release tag
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.preflight.outputs.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust toolchain for tests
        # The test suite exercises the include! formatting gate with real rustfmt.
        # Install the pinned toolchain before running it on a fresh runner.
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Run tests
        run: pnpm test

      - name: Build frontend
        run: pnpm run build

      - name: Upload frontend dist
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: frontend-dist
          path: dist
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    needs:
      - preflight
      - build-frontend
      - quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-aarch64
            runner: macos-15
            rust_target: aarch64-apple-darwin
            bundle_args: --bundles app,dmg
            updater_suffix: .app.tar.gz
          - platform: windows-x86_64
            runner: windows-2025
            rust_target: x86_64-pc-windows-msvc
            bundle_args: --bundles nsis
            updater_suffix: .nsis.zip

    steps:
      - name: Checkout release tag
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.preflight.outputs.sha }}

      - name: Download frontend dist
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: frontend-dist
          path: dist

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Setup Rust toolchain
        # 使用完整 action SHA 时必须显式传入工具链，并与 rust-toolchain.toml 保持一致；
        # 否则 rustc 版本变化会使 rust-cache 的 key 失配、缓存失效。
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.95.0
          targets: ${{ matrix.rust_target }}

      # Tag-triggered runs can only restore caches from the default branch,
      # and caches saved here (on the tag ref) can never be restored by later
      # releases — so this job restores the cache warmed on main (see
      # cache-warm.yml) without saving a new one.
      # add-job-id-key must stay false so the lookup key matches the one
      # cache-warm.yml saves (otherwise the job id becomes part of the key).
      - name: Cache Rust build
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: |
            src-tauri -> target
          add-job-id-key: false
          save-if: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri bundle on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # 用 tag 推导出的版本号覆盖配置，使测试构建（如 2.0.30-test.1）的包版本与 tag 一致
          # signingIdentity 覆盖为 adhoc：配置文件里的 "ShellSpan Dev" 是开发者本机钥匙串里的
          # 自签名证书，runner 上没有；自签名对 Gatekeeper 本就无效，CI 用 adhoc 签名即可
          node -e 'console.log(JSON.stringify({version: process.env.APP_VERSION, build: {beforeBuildCommand: ""}, bundle: {macOS: {signingIdentity: "-"}}}))' > tauri-ci-override.json
          read -r -a bundle_args <<< "$BUNDLE_ARGS"
          pnpm exec tauri build --target "$RUST_TARGET" "${bundle_args[@]}" --config tauri-ci-override.json
        env:
          APP_VERSION: ${{ needs.preflight.outputs.version }}
          BUNDLE_ARGS: ${{ matrix.bundle_args }}
          RUST_TARGET: ${{ matrix.rust_target }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Build Tauri bundle on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          APP_VERSION: ${{ needs.preflight.outputs.version }}
          RUST_TARGET: ${{ matrix.rust_target }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          perl -MLocale::Maketext::Simple -e 1
          # 用 tag 推导出的版本号覆盖配置，使测试构建（如 2.0.30-test.1）的包版本与 tag 一致
          # Windows 只发布 NSIS 安装包，更新包固定为 .nsis.zip：
          # MSI 会安装到不同目录，对 NSIS 安装做原地更新会错位。
          @{ version = $env:APP_VERSION; build = @{ beforeBuildCommand = '' } } | ConvertTo-Json -Compress | Set-Content -Path tauri-ci-override.json
          pnpm exec tauri build --target $env:RUST_TARGET --bundles nsis --config tauri-ci-override.json

      - name: Prepare release artifact
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          RUST_TARGET: ${{ matrix.rust_target }}
          UPDATER_SUFFIX: ${{ matrix.updater_suffix }}
        run: |
          mkdir -p release-artifact
          bundle_dir="src-tauri/target/$RUST_TARGET/release/bundle"
          if [[ ! -d "$bundle_dir" ]]; then
            bundle_dir="src-tauri/target/release/bundle"
          fi

          if [[ ! -d "$bundle_dir" ]]; then
            echo "Bundle directory not found for target $RUST_TARGET" >&2
            find src-tauri/target -type d | sort >&2 || true
            exit 1
          fi

          if [[ "$PLATFORM" == darwin-* ]]; then
            app_path="$(find "$bundle_dir" -name '*.app' -type d -prune | head -n 1)"
            if [[ -z "$app_path" ]]; then
              echo "macOS .app bundle not found in $bundle_dir" >&2
              find "$bundle_dir" -print >&2
              exit 1
            fi

            app_binary="$app_path/Contents/MacOS/ShellSpan"
            if [[ ! -x "$app_binary" ]]; then
              echo "macOS app executable not found: $app_binary" >&2
              exit 1
            fi

            archs="$(lipo -archs "$app_binary")"
            expected_arch="arm64"

            if [[ " $archs " != *" $expected_arch "* ]]; then
              echo "Unexpected macOS app architecture for $PLATFORM: $archs" >&2
              exit 1
            fi

            codesign --verify --deep --strict --verbose=2 "$app_path"
          fi

          cp -R "$bundle_dir" release-artifact/bundle

          if [[ "$PLATFORM" == darwin-* ]]; then
            archive="$(find release-artifact/bundle -type f -name '*.app.tar.gz' | head -n 1)"
            dmg="$(find release-artifact/bundle -type f -name '*.dmg' | head -n 1)"
            if [[ -z "$archive" || ! -f "${archive}.sig" || -z "$dmg" ]]; then
              echo "Required macOS release assets are incomplete" >&2
              find release-artifact/bundle -type f -print >&2
              exit 1
            fi

            archive_dir="$(dirname "$archive")"
            renamed_archive="${archive_dir}/ShellSpan-${PLATFORM}.app.tar.gz"
            mv "$archive" "$renamed_archive"
            mv "${archive}.sig" "${renamed_archive}.sig"
            mv "$dmg" "$(dirname "$dmg")/ShellSpan-${PLATFORM}.dmg"
          else
            # Windows 只发布 NSIS：更新包固定为 .nsis.zip（MSI 会安装到不同目录，
            # 对 NSIS 安装做原地更新会错位），此处仅校验产物完整。
            installer_count="$(find release-artifact/bundle -type f -name '*-setup.exe' | wc -l | tr -d ' ')"
            nsis_updater="$(find release-artifact/bundle -type f -name '*.nsis.zip' | head -n 1)"
            if [[ -z "$nsis_updater" || "$installer_count" != "1" ]]; then
              echo "Required Windows release assets are missing or ambiguous" >&2
              find release-artifact/bundle -type f -print >&2
              exit 1
            fi
            UPDATER_SUFFIX=".nsis.zip"
          fi

          cat > release-artifact/release-metadata.json <<EOF
          {
            "platform": "$PLATFORM",
            "updaterArchiveSuffix": "$UPDATER_SUFFIX"
          }
          EOF

      - name: Upload bundle artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: bundle-${{ matrix.platform }}
          path: release-artifact
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  release:
    name: Publish Release
    runs-on: ubuntu-24.04
    needs:
      - preflight
      - build
      - quality
    concurrency:
      group: publish-release
      cancel-in-progress: false
    permissions:
      contents: write

    steps:
      - name: Checkout release tag
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Download bundle artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: release-inputs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install updater signature verifier
        run: sudo apt-get update && sudo apt-get install -y minisign

      - name: Test signature verification against real signed bytes
        run: node --test scripts/release-signatures.integration.mjs

      - name: Verify assets, publish draft, and promote Latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        run: node scripts/publish-release.mjs

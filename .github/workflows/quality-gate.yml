name: Quality Gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend and Audit
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run frontend review gate
        run: pnpm review:frontend

  rust:
    name: Rust (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-2025
          - platform: macos
            runner: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit Agent terminal boundaries
        run: pnpm check:agent-terminal
      - name: Run frontend tests
        run: pnpm test
      - name: Build frontend
        run: pnpm build
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - name: Cache Rust
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
      - name: Check formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - name: Run M6 native shell and PTY acceptance
        run: pnpm test:agent:platform
      - name: Run Agent terminal contract tests
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --locked agent::terminal -- --test-threads=1
          cargo test --manifest-path src-tauri/Cargo.toml --locked terminal_lease -- --test-threads=1
      - name: Run Petdex Phase 0 contract probe
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --test petdex_contract_probe -- --test-threads=1
      - name: Run Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets --locked

  ssh-e2e:
    name: Isolated SSH/SFTP E2E
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.95.0
      - name: Install Tauri build dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Cache Rust
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri -> target
      - name: Start isolated SSH service
        run: |
          docker build --tag shellspan-ssh-e2e:local tests/ssh-e2e
          docker compose --project-name shellspan-e2e --file tests/ssh-e2e/compose.yml up --detach --wait --pull never
      - name: Run SSH/SFTP end-to-end test
        env:
          SHELLSPAN_E2E_SSH_FIXTURE: "1"
          SHELLSPAN_E2E_SSH_HOST: 127.0.0.1
          SHELLSPAN_E2E_SSH_PORT: "22222"
          SHELLSPAN_E2E_SSH_USERNAME: shellspan
          SHELLSPAN_E2E_SSH_PASSWORD: shellspan-e2e
          SHELLSPAN_E2E_SSH_JUMP_HOST: 127.0.0.1
          SHELLSPAN_E2E_SSH_JUMP_PORT: "22223"
          SHELLSPAN_E2E_SSH_JUMP_TARGET_HOST: ssh
          SHELLSPAN_E2E_SSH_JUMP_TARGET_PORT: "22"
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked isolated_ssh_sftp_end_to_end -- --ignored --nocapture --test-threads=1
      - name: Stop isolated SSH service
        if: always()
        run: docker compose --project-name shellspan-e2e --file tests/ssh-e2e/compose.yml down --volumes --remove-orphans

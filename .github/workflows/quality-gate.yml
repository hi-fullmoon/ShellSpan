name: Quality Gate

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Exact commit to validate
        required: true
        type: string
      frontend-artifact:
        description: Frontend dist built at ref after frontend tests and static checks in this workflow run
        required: false
        default: ''
        type: string
      macos-editor-artifact:
        description: macOS Zsh and ZLE resources built at ref in this workflow run
        required: false
        default: ''
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: quality-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend and Audit
    if: ${{ !inputs.frontend-artifact }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Setup Rust toolchain for tests
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.95.0
          components: rustfmt
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Run static checks
        run: pnpm check:ci:static
      - name: Run frontend tests
        run: pnpm test
      - name: Build frontend
        run: pnpm build
      - name: Upload frontend dist
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: frontend-dist
          path: dist
          if-no-files-found: error
          retention-days: 1

  rust:
    name: Rust (${{ matrix.platform }})
    needs: frontend
    # Release supplies a tested dist and intentionally skips the local producer.
    if: >-
      ${{ !cancelled() && (needs.frontend.result == 'success' ||
        (inputs.frontend-artifact != '' && needs.frontend.result == 'skipped')) }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-2025
          - platform: macos
            # The pinned private Zsh main/Core require macOS 27.
            runner: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - name: Install ripgrep on macOS
        if: runner.os == 'macOS'
        run: brew install ripgrep
      - name: Install ripgrep on Windows
        if: runner.os == 'Windows'
        run: choco install ripgrep --yes --no-progress
      - name: Run frontend tests
        run: pnpm test
      - name: Download tested frontend dist
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ${{ inputs.frontend-artifact || 'frontend-dist' }}
          path: dist
      - name: Cache Rust
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
      - name: Build pinned Bash and Readline test resources
        if: runner.os == 'macOS'
        env:
          SHELLSPAN_NATIVE_BUILD_ROOT: artifacts/tests
        run: python3 -B scripts/native-input-p2/build.py --versions 5.3
      - name: Build pinned Zsh and ZLE test resources
        if: runner.os == 'macOS' && !inputs.macos-editor-artifact
        env:
          SHELLSPAN_NATIVE_BUILD_ROOT: artifacts/tests
        run: bash scripts/native-input-p3/build-macos-editor.sh
      - name: Download pinned Zsh and ZLE test resources
        if: runner.os == 'macOS' && inputs.macos-editor-artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ${{ inputs.macos-editor-artifact }}
          path: artifacts/tests
      - name: Restore executable permission on downloaded Zsh
        if: runner.os == 'macOS' && inputs.macos-editor-artifact
        run: chmod 500 artifacts/tests/native-input-p2/resources/native-input/zsh-5.9-zle-5.9-macos-arm64-native/zsh
      - name: Run Agent terminal contract tests
        run: node scripts/verify-agent-terminal-contracts.mjs
      - name: Run Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features --locked -- -D warnings
      - name: Run Rust tests
        # Real shell/process and wall-clock tests share the runner. Match the
        # native acceptance runners so unrelated tests cannot starve deadlines.
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-features --no-fail-fast --locked -- --test-threads=1
      - name: Run native subagent budget UI regression
        run: pnpm test:subagent-budget:native

  ssh-e2e:
    name: Isolated SSH/SFTP E2E
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install gate dependencies
        run: pnpm install --frozen-lockfile
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.95.0
      - name: Install Tauri build dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Cache Rust
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri -> target
      - name: Start isolated SSH service
        run: |
          docker build --tag shellspan-ssh-e2e:local tests/ssh-e2e
          docker compose --project-name shellspan-e2e --file tests/ssh-e2e/compose.yml up --detach --wait --pull never
      - name: Run SSH/SFTP end-to-end test
        env:
          SHELLSPAN_E2E_SSH_FIXTURE: "1"
          SHELLSPAN_E2E_SSH_HOST: 127.0.0.1
          SHELLSPAN_E2E_SSH_PORT: "22222"
          SHELLSPAN_E2E_SSH_USERNAME: shellspan
          SHELLSPAN_E2E_SSH_PASSWORD: shellspan-e2e
          SHELLSPAN_E2E_SSH_JUMP_HOST: 127.0.0.1
          SHELLSPAN_E2E_SSH_JUMP_PORT: "22223"
          SHELLSPAN_E2E_SSH_JUMP_TARGET_HOST: ssh
          SHELLSPAN_E2E_SSH_JUMP_TARGET_PORT: "22"
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked isolated_ssh_sftp_end_to_end -- --ignored --nocapture --test-threads=1
      - name: Stop isolated SSH service
        if: always()
        run: docker compose --project-name shellspan-e2e --file tests/ssh-e2e/compose.yml down --volumes --remove-orphans

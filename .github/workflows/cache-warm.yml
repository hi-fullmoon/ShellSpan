name: Warm Rust Cache

# Release builds run on tag refs, and GitHub Actions caches are scoped to the
# ref that created them: a tag-triggered run can only restore caches from its
# own tag or from the default branch. This workflow keeps a fresh Rust build
# cache on main so release runs (release.yml, `save-if: false`) can restore it.

on:
  push:
    branches:
      - main
    paths:
      - src-tauri/**
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  warm:
    name: Warm ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    concurrency:
      group: cache-warm-${{ matrix.platform }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-aarch64
            runner: macos-15
            rust_target: aarch64-apple-darwin
          - platform: windows-x86_64
            runner: windows-2025
            rust_target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Rust toolchain
        # 使用完整 action SHA 时必须显式传入工具链；与 rust-toolchain.toml 保持一致。
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.95.0
          targets: ${{ matrix.rust_target }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: |
            src-tauri -> target
          # 缓存键默认包含 job id（warm），release.yml 的 build job 会查
          # v0-rust-build-... 而永远查不到这里的 v0-rust-warm-...，必须关掉
          add-job-id-key: false
          # 构建中途失败也把已编译的依赖进度存下来，避免下次从头全量重编
          cache-on-failure: true

      - name: Build release dependencies
        working-directory: src-tauri
        run: cargo build --release --locked --target ${{ matrix.rust_target }}

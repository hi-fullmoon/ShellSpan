[package]
name = "TermBridge"
version = "1.2.12"
description = "TermBridge desktop SSH client"
authors = ["Codex"]
license = "MIT"
edition = "2021"

[lib]
name = "term_bridge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
ssh2 = { version = "0.9.5", features = ["vendored-openssl"] }
tauri = { version = "2.11.3", features = ["tray-icon"] }
uuid = { version = "1.23.0", features = ["v4", "serde"] }
rfd = "0.17.2"
log = "0.4.29"
tauri-plugin-log = "2.8.0"
tauri-plugin-updater = "2.10.1"
socket2 = "0.6.3"
libc = "0.2.184"
sha2 = "0.10"
keyring = "2.3"

[package]
name = "ShellSpan"
version = "2.1.0"
description = "ShellSpan desktop SSH client"
authors = ["Codex"]
license = "MIT"
edition = "2021"

[lib]
name = "shell_span_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ssh2 = { version = "0.9.6", features = ["vendored-openssl"] }
libssh2-sys = "0.3.2"
tauri = { version = "2.11.5", features = ["tray-icon", "macos-private-api"] }
uuid = { version = "1.24.0", features = ["v4", "serde"] }
rfd = "0.17.2"
log = "0.4.33"
tauri-plugin-log = "2.9.0"
tauri-plugin-updater = "2.10.1"
socket2 = "0.6.5"
libc = "0.2.189"
sha2 = "0.11"
hmac = "0.12"
sha1 = "0.10"
base64 = "0.23"
crossbeam-channel = "0.5"
portable-pty = "0.9"
trash = "5"
rusqlite = { version = "0.40", features = ["bundled"] }
keyring-core = "1"
sysinfo = "0.39"
futures-util = "0.3"
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tokio-util = "0.7"
url = "2"
rwml = { version = "0.1.3", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }
core-foundation = "0.10"
core-foundation-sys = "0.8"
security-framework = "3"
security-framework-sys = "2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1"
windows-sys = { version = "0.60", features = [
  "Win32_Foundation",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_Networking_WinSock",
  "Win32_Storage",
  "Win32_Storage_FileSystem",
] }

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
dbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }

[dev-dependencies]
tempfile = "3.14.0"

[patch.crates-io]
portable-pty = { path = "vendor/portable-pty" }

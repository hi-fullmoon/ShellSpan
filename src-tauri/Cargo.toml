[package]
name = "TermBridge"
version = "2.0.47"
description = "TermBridge desktop SSH client"
authors = ["Codex"]
license = "MIT"
edition = "2021"

[lib]
name = "term_bridge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ssh2 = { version = "0.9.6", features = ["vendored-openssl"] }
tauri = { version = "2.11.5", features = ["tray-icon", "macos-private-api"] }
uuid = { version = "1.24.0", features = ["v4", "serde"] }
rfd = "0.17.2"
log = "0.4.33"
tauri-plugin-log = "2.9.0"
tauri-plugin-updater = "2.10.1"
socket2 = "0.6.5"
libc = "0.2.189"
sha2 = "0.11"
base64 = "0.23"
portable-pty = "0.9"
trash = "5"
rusqlite = { version = "0.40", features = ["bundled"] }
keyring-core = "1"
sysinfo = "0.39"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }
core-foundation = "0.10"
core-foundation-sys = "0.8"
security-framework = "3"
security-framework-sys = "2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1"
windows-sys = { version = "0.60", features = [
  "Win32_Foundation",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_Networking_WinSock",
] }

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
dbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }

[dev-dependencies]
tempfile = "3.14.0"

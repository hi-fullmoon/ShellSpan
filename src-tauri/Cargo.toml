[package]
name = "ShellSpan"
version = "3.0.0-beta.5"
description = "ShellSpan desktop SSH client"
authors = ["Codex"]
license = "MIT"
edition = "2021"

[lib]
name = "shell_span_lib"
crate-type = ["rlib"]

[features]
# Opt-in observation for isolated debug acceptance runs; absent from release.
native-input-acceptance = []

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9"
regex = "1"
pulldown-cmark = { version = "0.13.4", default-features = false }
linkify = "0.11.0"
ssh2 = { version = "0.9.6", features = ["vendored-openssl"] }
libssh2-sys = "0.3.3"
russh-sftp = "3.0.1"
tauri = { version = "2.11.5", features = ["tray-icon", "macos-private-api"] }
uuid = { version = "1.26.1", features = ["v4", "serde"] }
rfd = "0.17.2"
log = "0.4.34"
tauri-plugin-log = "2.9.1"
tauri-plugin-updater = "2.11.0"
tauri-plugin-notification = "2"
notify-rust = "4.18"
socket2 = "0.6.5"
libc = "0.2.189"
sha2 = "0.11"
hmac = "0.13"
sha1 = "0.11"
hex = "0.4.3"
base64 = "0.23"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
moxcms = "0.8.1"
png = "0.18"
diffy = "0.5"
tree-sitter = "0.27"
tree-sitter-bash = "0.25.1"
shlex = "2.0.1"
zeroize = "1"
unicode-segmentation = "1.13.3"
crossbeam-channel = "0.5"
portable-pty = "0.9"
vt100 = "0.16.2"
vtparse = { version = "0.7.0", default-features = false, features = ["no_std"] }
vte = "0.15.0"
vte-capture = { package = "vte", version = "=0.14.1", default-features = false, features = ["no_std"] }
trash = "5"
rusqlite = { version = "0.40", features = ["bundled"] }
keyring-core = "1"
sysinfo = "0.39"
futures-util = "0.3"
async-trait = "0.1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls-no-provider", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt", "sync", "time"] }
tokio-util = { version = "0.7", features = ["codec"] }
httpdate = "1"
tempfile = "3.27.0"
zstd = "0.14"
url = "2"
rwml = { version = "0.1.4", default-features = false }
tauri-plugin-clipboard-manager = "2"
ssh-key = "0.6"
socks5-protocol = "0.3.5"

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2.5.4"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }
core-foundation = "0.10"
core-foundation-sys = "0.8"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSBitmapImageRep", "NSGraphicsContext", "NSImage", "NSImageRep", "NSWorkspace", "objc2-core-graphics", "objc2-uniform-type-identifiers"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSBundle", "NSFileManager", "NSString", "NSURL"] }
objc2-uniform-type-identifiers = { version = "0.3", default-features = false, features = ["UTType"] }
security-framework = "3"
security-framework-sys = "2"

[target.'cfg(target_os = "windows")'.dependencies]
file_icon_provider = "1.0.2"
ssh2 = { version = "0.9.6", features = ["openssl-on-win32"] }
tokio = { version = "1", features = ["process"] }
windows-native-keyring-store = "1"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Cryptography",
  "Win32_Security_Cryptography_Catalog",
  "Win32_Security_Cryptography_Sip",
  "Win32_Security_Isolation",
  "Win32_Security_WinTrust",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_System_SystemInformation",
  "Win32_System_Pipes",
  "Win32_Networking_WinSock",
  "Win32_Storage",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Registry",
  "Win32_UI_Shell",
] }

[target.'cfg(target_os = "linux")'.dependencies]
gdk-pixbuf = "0.18"
gio = "0.18"
gtk = "0.18"

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
dbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }

[dev-dependencies]
httparse = "1.10.1"
tokio = { version = "1", features = ["test-util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev.package."*"]
opt-level = 2

[patch.crates-io]
portable-pty = { path = "vendor/portable-pty" }

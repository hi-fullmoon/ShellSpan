[package]
name = "shellspan-native-input-editors"
version = "1.0.0"
edition = "2021"
publish = false
license = "MIT"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
bytes = "1"
hex = "0.4"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
shlex = "1.3"
tokio-util = { version = "0.7", features = ["codec"] }
unicode-segmentation = "1.12"

[dev-dependencies]
portable-pty = { path = "../vendor/portable-pty" }
vt100 = "0.16.2"
vte = "0.15.0"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Pipes"] }
vte-capture = { package = "vte", version = "=0.14.1", default-features = false, features = ["no_std"] }

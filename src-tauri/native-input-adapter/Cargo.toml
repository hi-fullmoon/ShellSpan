[package]
name = "shellspan-native-input-adapter"
version = "1.0.0"
edition = "2021"
publish = false
license = "GPL-3.0-or-later"

[lib]
crate-type = ["staticlib"]

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
shlex = "1.3"
unicode-segmentation = "1.12"
hex = "0.4"
bytes = "1"
tokio-util = { version = "0.7", features = ["codec"] }

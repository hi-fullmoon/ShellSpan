# Candidate notes only. Reviewed release-notes/*.md are the publication source.
[changelog]
header = ""
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | trim }}{% if commit.breaking_description %} — {{ commit.breaking_description }}{% endif %} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/hi-fullmoon/ShellSpan/commit/{{ commit.id }}))
{%- endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
protect_breaking_commits = true
split_commits = false
sort_commits = "oldest"
commit_parsers = [
  { body = "BREAKING[ -]CHANGE:", group = "升级注意事项" },
  { message = "^[a-z]+(\\([^)]*\\))?!:", group = "升级注意事项" },
  { message = "^feat", group = "新增功能" },
  { message = "^fix", group = "问题修复" },
  { message = "^perf", group = "性能优化" },
  { message = "^revert", group = "行为调整" },
  { body = "Release-Note:", group = "体验改进" },
  { message = "^(chore|ci|build|test|docs|style|refactor)(\\(|:)", skip = true },
  { message = ".*", group = "待分类" },
]

[remote.github]
owner = "hi-fullmoon"
repo = "ShellSpan"

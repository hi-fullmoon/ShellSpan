[package]
name = "shellspan-p3-journal-probe"
version = "1.0.0"
edition = "2021"
publish = false
license = "MIT"

[workspace]

[dependencies]
bytes = "1"
hex = "=0.4.3"
shlex = "=1.3.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
tokio-util = { version = "0.7", features = ["codec"] }
rusqlite = { version = "=0.40.0", features = ["bundled"] }
uuid = { version = "=1.26.1", features = ["v4"] }
